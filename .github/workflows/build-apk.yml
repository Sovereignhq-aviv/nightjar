name: Build APK

# Builds an installable APK in the cloud on every push, so nothing needs to be
# installed locally. The finished file is attached to the run as an artifact.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the platform this app targets
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # Every build must be signed with the SAME key, or Android refuses to install a new
      # version over the old one and the user has to uninstall - losing all their recordings.
      # The key is committed to the repo; if it is ever missing, one is generated and uploaded
      # so it can be committed.
      - name: Ensure a stable debug signing key
        run: |
          if [ ! -f debug.keystore ]; then
            echo "No committed keystore - generating one to be committed."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "GENERATED_KEYSTORE=1" >> "$GITHUB_ENV"
          fi

      - name: Upload the generated keystore so it can be committed
        if: env.GENERATED_KEYSTORE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          if-no-files-found: error

      # YAMNet, Google's AudioSet-trained sound classifier. Fetched at build time rather than
      # committed, so the repo stays free of binaries.
      - name: Fetch the YAMNet model
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/yamnet.tflite \
            https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite
          ls -l app/src/main/assets/yamnet.tflite

      # Pinned rather than using whatever Gradle the runner ships, because Android
      # Gradle Plugin 8.7 is only compatible with a known Gradle range.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run the engine tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename for clarity
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/SleepWave.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: SleepWave-apk
          path: out/SleepWave.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
