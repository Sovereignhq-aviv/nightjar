name: Build APK

# Builds an installable APK in the cloud on every push, so nothing needs to be
# installed locally. The finished file is attached to the run as an artifact.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the platform this app targets
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      # The signing key lives in a repository secret, never in the repo.
      #
      # Every build has to use the same key or Android refuses to install a new version over an old
      # one. But a published signing key is worse than no key at all: anyone could then sign an APK
      # that phones accept as an update to this app. Hence the secret.
      #
      # Forks and pull requests receive no secrets, so they generate a throwaway key and build fine.
      # Their APKs simply will not install over one built here, which is the correct outcome.
      - name: Restore or create the signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Signing with the stored key."
          else
            echo "No DEBUG_KEYSTORE_B64 secret; generating a throwaway key for this build."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=Android Debug,O=Android,C=US"
            echo "GENERATED_KEYSTORE=1" >> "$GITHUB_ENV"
          fi

      # Only when a key had to be invented: publish it as an artifact so it can be stored as the
      # DEBUG_KEYSTORE_B64 secret, after which every later build signs identically.
      - name: Upload the generated key so it can become the secret
        if: env.GENERATED_KEYSTORE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          if-no-files-found: error

      # YAMNet, Google's AudioSet-trained sound classifier (Apache 2.0). Fetched at build time
      # rather than committed, so the repository holds no binaries at all.
      - name: Fetch the YAMNet model
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/yamnet.tflite https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite
          ls -l app/src/main/assets/yamnet.tflite

      # Pinned rather than using whatever Gradle the runner ships, because Android Gradle Plugin 8.7
      # is only compatible with a known Gradle range.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run the engine tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename for clarity
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Nightjar.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Nightjar-apk
          path: out/Nightjar.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
